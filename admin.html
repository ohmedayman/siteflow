<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SiteFlow — لوحة الإدارة العليا 👑</title>
<link rel="icon" type="image/svg+xml" href="assets/sitflow.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Tajawal:wght@400;500;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=40">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
</head>
<body style="background:#f8fafc;min-height:100vh">
  <!-- Standalone Admin Topbar -->
  <header class="sf-admin-standalone-bar">
    <div class="sf-admin-standalone-brand">
      <img src="assets/sitflow.svg" alt="SiteFlow" width="32" height="32">
      <span>SiteFlow Admin Portal 👑</span>
    </div>
    <div style="display:flex;align-items:center;gap:12px">
      <a href="./#/" class="btn btn-ghost btn-sm" style="color:#94a3b8;border:1px solid #334155;border-radius:8px">
        الموقع الرئيسي ↗
      </a>
    </div>
  </header>

  <main id="app" style="min-height:calc(100vh - 60px)"></main>

  <script src="js/icons.js?v=40"></script>
  <script src="js/presets.js?v=40"></script>
  <script src="js/templates-data.js?v=40"></script>
  <script src="js/supabase.js?v=40"></script>
  <script src="js/storage.js?v=40"></script>
  <script src="js/auth.js?v=40"></script>
  <script src="js/ai.js?v=40"></script>
  <script src="js/templates.js?v=40"></script>
  <script src="js/builder.js?v=40"></script>
  <script src="js/app.js?v=40"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      document.querySelector('.app-header')?.classList.add('hidden');
      Router._adminStandalone = true;
      if (typeof Auth !== 'undefined') await Auth.init();
      Router._admin();
    });
  </script>
</body>
</html>
